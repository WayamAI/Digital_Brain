# Local run of the production image:
#   docker compose up --build      → http://localhost:8080
#
# This builds the same Dockerfile Render uses, so if it works here it works
# there. Change HOST_PORT to move it off 8080 without touching the container.

services:
  digital-brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-brain:latest
    container_name: digital-brain
    # Reap zombies and forward SIGTERM so the container stops promptly.
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
